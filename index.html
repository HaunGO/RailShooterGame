<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Rail Shooter MVP</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      (function () {
        var script = document.querySelector('script[type="module"]');
        if (!script) return;
        var scriptPath = (script.src && new URL(script.src).pathname) || '';
        // only run deploy-check in production (built assets); skip in dev to avoid mobile reload issues
        if (scriptPath.indexOf('/assets/') === -1) return;
        var currentPath = scriptPath;
        function check() {
          fetch(window.location.pathname + '?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/src="(\/assets\/[^"]+\.js)"/);
              var newPath = m ? m[1] : '';
              if (newPath && newPath !== currentPath) location.reload();
            })
            .catch(function () {});
        }
        setInterval(check, 12000);
      })();
    </script>
  </body>
</html>
